name: MILCHO HUB - Live Data Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-data.yml"
      - "refresh_data.py"

permissions:
  contents: write

concurrency:
  group: milcho-hub-live-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect ESO and market data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chromium for live ESO page refresh
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Chromium
        run: |
          google-chrome --version

      - name: Run live data collector
        run: python refresh_data.py

      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data.json")
          if not p.exists():
              raise SystemExit("data.json was not generated")
          data = json.loads(p.read_text(encoding="utf-8"))
          required = ("eso_generation", "eso_flows", "eso_load", "frequency")
          failed = [name for name in required if not data.get("sources", {}).get(name, {}).get("ok")]
          if failed:
              raise SystemExit("Core source checks failed: " + ", ".join(failed))
          print("Snapshot timestamp:", data.get("updated_at"))
          print("Core ESO sources: OK")
          print("IBEX source:", data.get("sources", {}).get("ibex", {}))
          PY

      - name: Commit updated data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh MILCHO HUB live data"
            git push
          fi
