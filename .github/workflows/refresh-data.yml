name: Refresh MILCHO HUB live data
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-data.yml"
      - "refresh_data.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: milcho-hub-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect public operational data
        run: python3 refresh_data.py
      - name: Commit updated data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh MILCHO HUB live data"
            git push
          fi
